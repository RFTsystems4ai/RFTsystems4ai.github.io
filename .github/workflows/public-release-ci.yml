name: public-release-ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify-public-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          find assets lab challenge evolution-data -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Cryptographic, deterministic, publication and navigation tests
        run: npm test
